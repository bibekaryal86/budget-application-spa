service: default
runtime: nodejs24
env: standard
instance_class: F1
handlers:
  # 1. Serve the Vite assets directory explicitly
  - url: /assets
    static_dir: dist/assets

  # 2. Serve static files in the root (like favicon.ico, robots.txt, vite.svg)
  - url: /(.*\.(svg|ico|png|jpg|js|css|json|txt))$
    static_files: dist/\1
    upload: dist/.*\.(svg|ico|png|jpg|js|css|json|txt)$

  # 3. Catch-all: Route all other requests to index.html for client-side routing
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
automatic_scaling:
  # min_instances: 1
  max_instances: 1
  # min_idle_instances: 1
  # max_idle_instances: 1
  # min_pending_latency: 5000ms
  # max_pending_latency: 10000ms
  max_concurrent_requests: 80
