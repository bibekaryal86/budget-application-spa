service: backend
runtime: nodejs24
env: standard
instance_class: F1
handlers:
  - url: /.*
    script: auto
automatic_scaling:
  # min_instances: 1
  max_instances: 1
  # min_idle_instances: 1
  # max_idle_instances: 1
  # min_pending_latency: 5000ms
  # max_pending_latency: 10000ms
  max_concurrent_requests: 80
env_variables:
  NODE_ENV: production
includes:
  - app-dot-env.yaml
